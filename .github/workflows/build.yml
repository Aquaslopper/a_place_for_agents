name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raylib system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev libudev-dev
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"
      - name: Package
        run: |
          cd build/bin
          zip -r ../../APlaceForAgents-Linux.zip APlaceForAgents assets
      - uses: actions/upload-artifact@v4
        with:
          name: APlaceForAgents-Linux
          path: APlaceForAgents-Linux.zip

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          cd build/bin/Release || cd build/bin
          7z a ../../APlaceForAgents-Windows.zip APlaceForAgents.exe assets
      - uses: actions/upload-artifact@v4
        with:
          name: APlaceForAgents-Windows
          path: APlaceForAgents-Windows.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: APlaceForAgents-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" APlaceForAgents-Linux.zip APlaceForAgents-Windows.zip --generate-notes --title "A Place for Agents ${GITHUB_REF_NAME}"
